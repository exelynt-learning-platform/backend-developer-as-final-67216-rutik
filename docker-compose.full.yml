version: "3.8"

# Runs the application itself AND PostgreSQL together in Docker.
# Usage: docker compose -f docker-compose.full.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: booking_system
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking_user -d booking_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: booking-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/booking_system
      DB_USERNAME: booking_user
      DB_PASSWORD: booking_pass
      #These credentials only for development and review purpose directly are given here
      DB_DRIVER: org.postgresql.Driver
      JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: change-this-in-any-real-deployment-min-32-bytes-long-secret
      DDL_AUTO: update

volumes:
  postgres-data:
