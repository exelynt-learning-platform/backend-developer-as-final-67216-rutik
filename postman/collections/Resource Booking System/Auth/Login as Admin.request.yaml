$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('adminToken', body.token);
    language: text/javascript
order: 1000
