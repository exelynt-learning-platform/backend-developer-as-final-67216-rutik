# Activate with SPRING_PROFILES_ACTIVE=mysql
# and set DB_URL / DB_USERNAME / DB_PASSWORD accordingly, e.g.:
#   DB_URL=jdbc:mysql://localhost:3306/booking_system
#   DB_DRIVER=com.mysql.cj.jdbc.Driver
#   JPA_DIALECT=org.hibernate.dialect.MySQLDialect
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_system}
    username: ${DB_USERNAME:booking_user}
    password: ${DB_PASSWORD:booking_pass}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
